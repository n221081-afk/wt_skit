<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PHP Firebase Login System</title>
    <style>
      /* Shared styles from earlier PHP login project */
      :root{--bg:#f4f7fb;--card:#ffffff;--accent:#4f46e5;--muted:#6b7280;--danger:#ef4444}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
      body{background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);display:flex;align-items:center;justify-content:center;padding:24px}
      .centered{width:100%;max-width:420px}
      .card{background:var(--card);border-radius:12px;padding:28px;box-shadow:0 6px 24px rgba(15,23,42,0.08)}
      h1{margin:0 0 12px;font-size:22px}
      p{margin:0 0 16px}
      a.btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;border:none;cursor:pointer;font-weight:600;margin-top:8px}
      a.btn:hover{opacity:0.95}
    </style>
  </head>
  <body>
    <main class="centered">
      <div class="card">
        <h1>Welcome</h1>
        <p>Select an action:</p>
        <p><a class="btn" href="public/login.php">Log in</a></p>
        <p><a class="btn" href="public/register.php">Register</a></p>
      </div>
    </main>
  </body>
</html>
